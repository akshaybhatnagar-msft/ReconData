name: Build Debug APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper JAR
        working-directory: SmsDeleteApp
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        working-directory: SmsDeleteApp
        run: chmod +x gradlew

      - name: Create local.properties
        working-directory: SmsDeleteApp
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: SmsDeleteApp
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsDelete-debug
          path: SmsDeleteApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
